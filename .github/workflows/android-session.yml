name: Android session install regression
on:
  push:
    paths: ['android/**', 'tests/android_session_runtime.py', '.github/workflows/android-session.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Upgrade through the real Android installer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 tests/android_session_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-session-evidence-${{ matrix.api }}
          path: |
            build/session-runtime/*.txt
            build/session-runtime/*.xml
            build/session-runtime/*.png
